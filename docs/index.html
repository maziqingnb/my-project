<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>足球水位分析看板</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1a1d23; --muted: #6b7280;
    --border: #e5e7eb; --strong: #d92d20; --watch: #d97706;
    --league: #2563eb; --cup: #7c3aed; --accent: #2563eb;
    --win: #16a34a; --half-win: #4ade80; --push: #9ca3af; --half-loss: #fbbf24; --loss: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111318; --card: #1a1d23; --ink: #e5e7eb; --muted: #9ca3af;
            --border: #2a2e37; --accent: #60a5fa; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
         background: var(--bg); color: var(--ink); line-height: 1.5; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  section { margin-bottom: 32px; }
  h2 { font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; color: #fff; }
  .tag.league { background: var(--league); }
  .tag.cup { background: var(--cup); }

  /* 顶部标签页 */
  .tabs { display: flex; gap: 4px; margin: 12px 0 16px; border-bottom: 1px solid var(--border); }
  .tab { padding: 9px 18px; font-size: 14px; cursor: pointer; border: none; background: none;
         color: var(--muted); border-bottom: 2px solid transparent; font-family: inherit; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  /* 命中率统计 */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .stat .num { font-size: 26px; font-weight: 700; line-height: 1.1; }
  .stat .num.big-rate { color: var(--win); }
  .stat .lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .stat .sub { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { font-size: 11px; padding: 1px 8px; border-radius: 6px; background: var(--bg); border: 1px solid var(--border); }

  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--border);
          border-radius: 10px; overflow: hidden; font-size: 14px; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { background: var(--card); color: var(--muted); font-weight: 600; font-size: 12px; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 10px; border-radius: 6px; font-weight: 600; color: #fff; }
  .badge.strong { background: var(--strong); }
  .badge.watch { background: var(--watch); }
  .badge.pass { background: var(--push); }
  .badge.prematch { background: #0891b2; }
  .score { display: flex; align-items: center; gap: 8px; }
  .bar { width: 80px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .reasons { color: var(--muted); font-size: 12px; margin: 0; padding-left: 16px; }
  .empty { color: var(--muted); text-align: center; padding: 40px; background: var(--card);
           border: 1px dashed var(--border); border-radius: 10px; }
  .market { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .tablewrap { overflow-x: auto; }
  .spark { display: block; }

  /* 进行中比赛 */
  .live-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
  .live-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .live-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--strong); animation: pulse 1.2s infinite; }
  .live-score { font-size: 18px; font-weight: 700; color: var(--accent); padding: 0 2px; }
  .live-sub { margin-top: 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .day-title { margin: 16px 0 6px; font-size: 14px; color: var(--muted); }

  /* 赛果 */
  .outcome { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 6px; color: #fff; white-space: nowrap; }
  .outcome.win { background: var(--win); }
  .outcome.half_win { background: var(--half-win); color: #14532d; }
  .outcome.push { background: var(--push); }
  .outcome.half_loss { background: var(--half-loss); color: #713f12; }
  .outcome.loss { background: var(--loss); }
  .outcome.pending { background: var(--bg); color: var(--muted); border: 1px solid var(--border); }
  .final { font-size: 13px; font-weight: 700; margin-left: 4px; white-space: nowrap; }
</style>
</head>
<body>
<div class="wrap">
  <h1>⚽ 足球水位分析看板</h1>
  <div class="tabs">
    <button class="tab active" id="tab-rec" onclick="switchTab('rec')">⚽ 推荐</button>
    <button class="tab" id="tab-schedule" onclick="switchTab('schedule')">📅 赛程</button>
    <button class="tab" id="tab-history" onclick="switchTab('history')">📜 历史</button>
  </div>
  <div class="meta" id="meta">加载中…</div>
  <div id="live" class="tab-panel" data-tab="rec"></div>
  <div id="schedule" class="tab-panel" data-tab="schedule"></div>
  <div id="history" class="tab-panel" data-tab="history"></div>
  <div id="stats" class="tab-panel" data-tab="rec"></div>
  <div id="content" class="tab-panel" data-tab="rec"></div>
  <div id="review" class="tab-panel" data-tab="rec"></div>
</div>

<script>
const CONF = { strong: "强推", watch: "可关注", pass: "观望" };
const MARKET = { handicap: "亚盘", totals: "大小球" };
const MARKET_BBALL = { handicap: "让分", totals: "总分" };
const marketLabel = r => ((r.sport === "basketball" ? MARKET_BBALL : MARKET)[r.market] || r.market);

// NBA 球队英文名 -> 简体中文（仅用于展示，不影响数据匹配）
const NBA_CN = {
  "Los Angeles Lakers": "洛杉矶湖人", "Chicago Bulls": "芝加哥公牛", "Boston Celtics": "波士顿凯尔特人",
  "Atlanta Hawks": "亚特兰大老鹰", "Brooklyn Nets": "布鲁克林篮网", "Cleveland Cavaliers": "克利夫兰骑士",
  "Charlotte Hornets": "夏洛特黄蜂", "New York Knicks": "纽约尼克斯", "Detroit Pistons": "底特律活塞",
  "Miami Heat": "迈阿密热火", "Philadelphia 76ers": "费城76人", "Toronto Raptors": "多伦多猛龙",
  "Indiana Pacers": "印第安纳步行者", "Milwaukee Bucks": "密尔沃基雄鹿", "Orlando Magic": "奥兰多魔术",
  "Washington Wizards": "华盛顿奇才", "Oklahoma City Thunder": "俄克拉荷马雷霆",
  "Minnesota Timberwolves": "明尼苏达森林狼", "Denver Nuggets": "丹佛掘金", "Portland Trail Blazers": "波特兰开拓者",
  "Utah Jazz": "犹他爵士", "Phoenix Suns": "菲尼克斯太阳", "Sacramento Kings": "萨克拉门托国王",
  "Los Angeles Clippers": "洛杉矶快船", "Golden State Warriors": "金州勇士", "San Antonio Spurs": "圣安东尼奥马刺",
  "Dallas Mavericks": "达拉斯独行侠", "Houston Rockets": "休斯顿火箭", "Memphis Grizzlies": "孟菲斯灰熊",
  "New Orleans Pelicans": "新奥尔良鹈鹕"
};
const teamName = t => NBA_CN[t] || t;

function switchTab(name) {
  document.querySelectorAll(".tab").forEach(b =>
    b.classList.toggle("active", b.id === "tab-" + name));
  document.querySelectorAll(".tab-panel").forEach(p =>
    p.style.display = (p.dataset.tab === name) ? "" : "none");
}
const COMP = { epl: "英超", laliga: "西甲", seriea: "意甲", bundesliga: "德甲", ligue1: "法甲", ucl: "欧冠",
  primeira: "葡超", rpl: "俄超", superlig: "土超", brasileirao: "巴西甲", argentina: "阿甲", mls: "美职联",
  greeksl: "希腊超", denmark: "丹麦超", sweden: "瑞典超", poland: "波兰超",
  afc_cl: "亚冠精英", afc_cl2: "亚冠二级", intl_friendly: "国家队友谊赛", europa_league: "欧联杯",
  nba: "NBA" };
const OUTCOME_CN = { win: "中", half_win: "半赢", push: "走盘", half_loss: "半输", loss: "没中" };

function koTs(s) {
  if (!s) return 0;
  const t = /Z$|[+-]\d\d:\d\d$/.test(s) ? s : s + "Z"; // 后端存的是 UTC 无时区，补 Z
  return new Date(t).getTime() || 0;
}

function waterField(r) {
  if (r.market === "handicap") return r.side === "home" ? "handicap_home" : "handicap_away";
  return r.side === "over" ? "over" : "under";
}

function sparkline(r) {
  const field = waterField(r);
  const hist = (r.history || []).map(h => h[field]).filter(v => v != null && isFinite(v));
  if (hist.length < 2) return '<span class="market">—</span>';
  const w = 88, h = 28, pad = 3;
  const min = Math.min(...hist), max = Math.max(...hist);
  const range = (max - min) || 1;
  const step = w / (hist.length - 1);
  const pts = hist.map((v, i) => [i * step, h - pad - (v - min) / range * (h - 2 * pad)]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const tip = hist.map(v => v.toFixed(2)).join(" → ");
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${tip}">
    <title>${field}: ${tip}</title>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${pts[pts.length - 1][0].toFixed(1)}" cy="${pts[pts.length - 1][1].toFixed(1)}" r="3" fill="var(--accent)"/>
  </svg>`;
}

function resultCell(r) {
  const res = r.result || {};
  if (res.settled) {
    return `<span class="outcome ${res.outcome}">${res.outcome_cn}</span>
            <span class="final">${res.home_goals}-${res.away_goals}</span>`;
  }
  const ko = koTs(r.kickoff);
  const pending = ko && ko < Date.now() ? "待赛果" : "未开赛";
  return `<span class="outcome pending">${pending}</span>`;
}

function rateText(s) {
  if (!s) return "—";
  return (s.rate == null) ? "—" : s.rate + "%";
}

function chips(s) {
  if (!s || !s.counts) return "";
  const c = s.counts;
  return `<div class="chips">
    <span class="chip">中 ${c.win}</span><span class="chip">半赢 ${c.half_win}</span>
    <span class="chip">走盘 ${c.push}</span><span class="chip">半输 ${c.half_loss}</span>
    <span class="chip">没中 ${c.loss}</span></div>`;
}

function renderStats(hist) {
  if (!hist || !hist.stats) {
    document.getElementById("stats").innerHTML = "";
    return;
  }
  const st = hist.stats;
  const overall = st.overall || {};
  const cards = `
    <div class="stat"><div class="num">${hist.total ?? 0}</div><div class="lbl">累计推荐</div></div>
    <div class="stat"><div class="num">${overall.settled ?? 0}</div><div class="lbl">已结算</div><div class="sub">命中 ${overall.hit ?? 0} 场</div></div>
    <div class="stat"><div class="num big-rate">${rateText(overall)}</div><div class="lbl">累计命中率</div>${chips(overall)}</div>
    <div class="stat"><div class="num">${rateText(st.by_market && st.by_market.handicap)}</div><div class="lbl">亚盘命中率</div></div>
    <div class="stat"><div class="num">${rateText(st.by_market && st.by_market.totals)}</div><div class="lbl">大小球命中率</div></div>`;

  let compRows = "";
  if (st.by_competition) {
    const rows = Object.entries(st.by_competition).map(([k, s]) =>
      `<tr><td>${COMP[k] || k}</td><td>${s.settled ?? 0}</td><td>${rateText(s)}</td><td>${(s.hit ?? 0)}</td></tr>`).join("");
    compRows = `<div class="tablewrap"><table><thead><tr><th>联赛/杯赛</th><th>已结算</th><th>命中率</th><th>命中</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  document.getElementById("stats").innerHTML = `
    <section><h2>📊 命中率统计</h2><div class="stats-grid">${cards}</div>${compRows}</section>`;
}

function renderTable(title, cls, items) {
  if (!items.length) return "";
  const rows = items.map(r => `
    <tr>
      <td><strong>${teamName(r.home)}</strong> vs <strong>${teamName(r.away)}</strong><br>
          <span class="market">${(r.kickoff || "").replace("T", " ").slice(0, 16)}</span></td>
      <td><span class="market">${marketLabel(r)}</span></td>
      <td>${r.pick}</td>
      <td><div class="score"><span>${r.score}</span><div class="bar"><i style="width:${Math.min(r.score, 100)}%"></i></div></div></td>
      <td><span class="badge ${r.confidence}">${CONF[r.confidence]}</span>${r.prematch ? ' <span class="badge prematch">临场</span>' : ''}</td>
      <td>${resultCell(r)}</td>
      <td>${sparkline(r)}</td>
      <td><ul class="reasons">${r.reasons.map(x => `<li>${x}</li>`).join("")}</ul></td>
    </tr>`).join("");
  return `<section>
    <h2>${title} <span class="tag ${cls}">${cls === "cup" ? "杯赛口径" : "联赛口径"}</span></h2>
    <div class="tablewrap"><table><thead><tr><th>比赛</th><th>盘口</th><th>推荐</th><th>推荐系数</th><th>信心</th><th>赛果</th><th>水位走势</th><th>理由</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
  </section>`;
}

function bjTime(iso) {
  if (!iso) return "—";
  const t = /Z$|[+-]\d\d:\d\d$/.test(iso) ? iso : iso + "Z";
  const d = new Date(t);
  return isNaN(d) ? "—" : new Date(d.getTime() + 8 * 3600 * 1000).toISOString().slice(11, 19);
}

function renderLive(live, d) {
  const box = document.getElementById("live");
  const matches = (live && live.matches) || [];
  const upd = `更新于 ${bjTime(live && live.generated_at)}（北京）`;
  if (!matches.length) {
    box.innerHTML = `<section><h2>🔴 进行中</h2><div class="empty">暂无进行中的比赛。<span class="market">${upd}</span></div></section>`;
    return;
  }
  const recByKey = {};
  ((d && d.recommendations) || []).forEach(r => { recByKey[r.fixture_key] = r; });
  const rows = matches.map(m => {
    const rec = recByKey[m.fixture_key];
    const recCell = rec
      ? `<span class="badge ${rec.confidence}">${CONF[rec.confidence]}</span>
         <span class="market">${MARKET[rec.market]} ${rec.pick}</span>`
      : '<span class="market">未推荐</span>';
    return `<div class="live-card">
      <div class="live-head">
        <span class="live-dot"></span>
        <strong>${teamName(m.home)}</strong>
        <span class="live-score">${m.home_goals ?? 0} - ${m.away_goals ?? 0}</span>
        <strong>${teamName(m.away)}</strong>
        <span class="market">${COMP[m.competition] || m.competition}</span>
      </div>
      <div class="live-sub">${recCell}</div>
    </div>`;
  }).join("");
  box.innerHTML = `<section><h2>🔴 进行中 <span class="tag league">实时</span></h2>
    <div class="market">${upd} · 每 30 秒自动刷新</div>
    <div class="live-list">${rows}</div></section>`;
}

function bjDayTime(iso) {
  if (!iso) return { day: "—", hm: "—" };
  const t = /Z$|[+-]\d\d:\d\d$/.test(iso) ? iso : iso + "Z";
  const d = new Date(t);
  if (isNaN(d)) return { day: "—", hm: "—" };
  const bj = new Date(d.getTime() + 8 * 3600 * 1000).toISOString();
  return { day: bj.slice(5, 10), hm: bj.slice(11, 16) };
}

function renderSchedule(schedule) {
  const box = document.getElementById("schedule");
  const matches = (schedule && schedule.matches) || [];
  const upd = `更新于 ${bjTime(schedule && schedule.generated_at)}（北京）`;
  if (!matches.length) {
    box.innerHTML = `<section><h2>📅 赛程</h2><div class="empty">暂无未开赛的赛程。<span class="market">${upd}</span></div></section>`;
    return;
  }
  const byDay = {};
  matches.forEach(m => {
    const { day } = bjDayTime(m.kickoff);
    (byDay[day] = byDay[day] || []).push(m);
  });
  const blocks = Object.keys(byDay).sort().map(day => {
    const rows = byDay[day].map(m => {
      const dt = bjDayTime(m.kickoff);
      return `<tr>
        <td><span class="market">${dt.hm}</span></td>
        <td><strong>${teamName(m.home)}</strong> vs <strong>${teamName(m.away)}</strong></td>
        <td><span class="market">${COMP[m.competition] || m.competition}</span></td>
      </tr>`;
    }).join("");
    return `<div class="day-title">${day}</div>
      <div class="tablewrap"><table><thead><tr><th>开赛(北京)</th><th>对阵</th><th>联赛/杯赛</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }).join("");
  box.innerHTML = `<section><h2>📅 赛程 <span class="tag league">未开赛</span></h2>
    <div class="market">${upd} · 推荐只在开赛前 6 小时内上架 · 开赛前 2 小时内标记「临场」</div>${blocks}</section>`;
}

function renderReview(review) {
  const box = document.getElementById("review");
  const days = (review && review.days) || [];
  if (!days.length) {
    box.innerHTML = `<section><h2>📋 每日复盘</h2><div class="empty">暂无未命中的推荐。</div></section>`;
    return;
  }
  const blocks = days.map(day => {
    const items = (day.items || []).map(it => `
      <tr>
        <td><strong>${teamName(it.home)}</strong> vs <strong>${teamName(it.away)}</strong><br>
            <span class="market">${(it.kickoff || "").replace("T", " ").slice(0, 16)}</span></td>
        <td><span class="market">${MARKET[it.market]} ${it.pick}</span></td>
        <td><span class="outcome ${it.outcome}">${it.outcome_cn}</span>
            <span class="final">${it.home_goals}-${it.away_goals}</span></td>
        <td class="reasons">${it.note || ""}</td>
      </tr>`).join("");
    return `<div class="day-title">${day.date} · ${day.missed} 场未命中</div>
      <div class="tablewrap"><table><thead><tr><th>比赛</th><th>推荐</th><th>赛果</th><th>复盘</th></tr></thead><tbody>${items}</tbody></table></div>`;
  }).join("");
  box.innerHTML = `<section><h2>📋 每日复盘 <span class="tag watch">未命中</span></h2>${blocks}</section>`;
}

function renderHistory(hist) {
  const box = document.getElementById("history");
  const records = (hist && hist.records) || [];
  if (!records.length) {
    box.innerHTML = `<section><h2>📜 历史推荐</h2><div class="empty">暂无历史推荐，先跑一次同步与分析。</div></section>`;
    return;
  }
  // 已结算排前、未结算排后；同组内按开赛时间降序
  const rows = [...records].sort((a, b) => {
    const sa = a.settled ? 0 : 1, sb = b.settled ? 0 : 1;
    if (sa !== sb) return sa - sb;
    return koTs(b.kickoff) - koTs(a.kickoff);
  }).map(r => {
    const res = r.settled
      ? `<span class="outcome ${r.outcome}">${r.outcome_cn}</span>
         <span class="final">${r.home_goals}-${r.away_goals}</span>`
      : `<span class="outcome pending">${koTs(r.kickoff) < Date.now() ? "待赛果" : "未开赛"}</span>`;
    return `<tr>
      <td><strong>${teamName(r.home)}</strong> vs <strong>${teamName(r.away)}</strong><br>
          <span class="market">${(r.kickoff || "").replace("T", " ").slice(0, 16)}</span></td>
      <td><span class="market">${marketLabel(r)}</span></td>
      <td>${r.pick}</td>
      <td><div class="score"><span>${r.score}</span><div class="bar"><i style="width:${Math.min(r.score, 100)}%"></i></div></div></td>
      <td><span class="badge ${r.confidence}">${CONF[r.confidence]}</span>${r.prematch ? ' <span class="badge prematch">临场</span>' : ''}</td>
      <td>${res}</td>
    </tr>`;
  }).join("");
  const overall = (hist.stats && hist.stats.overall) || {};
  const settled = records.filter(r => r.settled).length;
  box.innerHTML = `<section>
    <h2>📜 历史推荐 <span class="tag league">全量账本</span></h2>
    <div class="market">共 ${records.length} 条（已结算 ${settled}）· 累计命中率 ${rateText(overall)}</div>
    <div class="tablewrap"><table><thead><tr><th>比赛</th><th>盘口</th><th>推荐</th><th>系数</th><th>信心</th><th>赛果</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
  </section>`;
}

switchTab("rec");        // 默认显示「推荐」，赛程在单独标签页

let latestData = null;   // 缓存 latest.json，供「进行中」板块交叉引用推荐

function loadLive() {
  return fetch("./reports/live.json")
    .then(r => r.ok ? r.json() : null)
    .catch(() => null)
    .then(live => renderLive(live, latestData));
}

function loadAll() {
  return Promise.all([
    fetch("./reports/latest.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
    fetch("./reports/history.json").then(r => r.ok ? r.json() : null).catch(() => null),
    fetch("./reports/live.json").then(r => r.ok ? r.json() : null).catch(() => null),
    fetch("./reports/review.json").then(r => r.ok ? r.json() : null).catch(() => null),
    fetch("./reports/schedule.json").then(r => r.ok ? r.json() : null).catch(() => null)
  ]).then(([d, hist, live, review, schedule]) => {
    latestData = d;
    const now = Date.now();
    const byKickoff = (a, b) => {
      const ta = koTs(a.kickoff), tb = koTs(b.kickoff);
      const ua = ta >= now ? 0 : 1, ub = tb >= now ? 0 : 1;
      if (ua !== ub) return ua - ub;            // 未开赛的排前面
      return ua === 0 ? ta - tb : tb - ta;      // 未开赛按开赛时间升序，已开赛按时间降序
    };
    const picks = (d.recommendations || []).filter(r => r.confidence === "strong" || r.confidence === "watch");
    const nStrong = picks.filter(r => r.confidence === "strong").length;
    const nPrematch = picks.filter(r => r.prematch === true).length;
    document.getElementById("meta").textContent =
      `生成时间 ${d.generated_at}（UTC） · ${d.scope} · 强推 ${nStrong} / 可关注 ${picks.length - nStrong} / 临场 ${nPrematch} · 本期共 ${d.total} 条`;
    renderStats(hist || { stats: d.stats, total: d.total });
    renderLive(live, d);
    renderSchedule(schedule);
    renderReview(review);
    renderHistory(hist);
    if (!picks.length) {
      document.getElementById("content").innerHTML =
        `<div class="empty">暂无推荐，请等待下一次同步与分析。</div>`;
      return;
    }
    const league = picks.filter(r => r.competition_class === "league").sort(byKickoff);
    const cup = picks.filter(r => r.competition_class === "cup").sort(byKickoff);
    document.getElementById("content").innerHTML =
      renderTable("🏆 杯赛", "cup", cup) + renderTable("⚽ 联赛", "league", league);
  });
}

// 首次全量加载；失败才显示错误提示
loadAll().catch(() => {
  document.getElementById("content").innerHTML =
    `<div class="empty">未找到数据。请先运行同步与分析，或开启 GitHub Pages 并确认 docs/reports/latest.json 已提交。</div>`;
});
// 进行中比分每 30 秒刷新；全量数据（含赛果命中结算）每 5 分钟刷新
setInterval(() => loadLive().catch(() => {}), 30000);
setInterval(() => loadAll().catch(() => {}), 300000);
</script>
</body>
</html>
