# ============================================================
# 足球水位分析系统 —— 配置文件
# 范围：五大联赛 + 欧冠；杯赛 / 联赛 分开计算
# ============================================================

competitions:
  - key: epl
    name: 英格兰超级联赛
    cls: league                 # league=联赛  cup=杯赛（分开计算）
    odds_sport_key: soccer_epl
    api_football_id: 39
    win007_id: 36
  - key: laliga
    name: 西班牙甲级联赛
    cls: league
    odds_sport_key: soccer_spain_la_liga
    api_football_id: 140
    win007_id: 31
  - key: seriea
    name: 意大利甲级联赛
    cls: league
    odds_sport_key: soccer_italy_serie_a
    api_football_id: 135
    win007_id: 34
  - key: bundesliga
    name: 德国甲级联赛
    cls: league
    odds_sport_key: soccer_germany_bundesliga
    api_football_id: 78
    win007_id: 8
  - key: ligue1
    name: 法国甲级联赛
    cls: league
    odds_sport_key: soccer_france_ligue_one
    api_football_id: 61
    win007_id: 11
  - key: ucl
    name: 欧洲冠军联赛
    cls: cup                    # 欧冠按杯赛口径统计
    odds_sport_key: soccer_uefa_champs_league
    api_football_id: 2
    win007_id: 103              # 欧冠杯（球探网 sclassid）

  # ---- 世界知名联赛（win007_id 已实测，五大联赛之外扩展） ----
  # 说明：win007 为默认数据源时只需 win007_id；odds_sport_key / api_football_id
  # 仅在切换 the-odds-api / API-Football 时需要，届时按各自文档补齐即可。
  - key: primeira
    name: 葡萄牙超级联赛
    cls: league
    win007_id: 23
  - key: rpl
    name: 俄罗斯超级联赛
    cls: league
    win007_id: 10
  - key: superlig
    name: 土耳其超级联赛
    cls: league
    win007_id: 30
  - key: brasileirao
    name: 巴西甲级联赛
    cls: league
    win007_id: 4
  - key: argentina
    name: 阿根廷甲级联赛
    cls: league
    win007_id: 2
  - key: mls
    name: 美国职业大联盟
    cls: league
    win007_id: 21
  - key: greeksl
    name: 希腊超级联赛
    cls: league
    win007_id: 32
  - key: denmark
    name: 丹麦超级联赛
    cls: league
    win007_id: 7
  - key: sweden
    name: 瑞典超级联赛
    cls: league
    win007_id: 26
  - key: poland
    name: 波兰超级联赛
    cls: league
    win007_id: 6

  # ---- 杯赛 / 国际赛事（含用户新增：亚冠、国家队比赛等） ----
  - key: afc_cl
    name: 亚冠精英
    cls: cup
    win007_id: 192
  - key: afc_cl2
    name: 亚冠二级
    cls: cup
    win007_id: 350
  - key: intl_friendly
    name: 国家队友谊赛
    cls: cup                    # 非联赛，按独立口径统计（不混入俱乐部联赛近况）
    win007_id: 1366
  - key: europa_league
    name: 欧洲联赛（欧联杯 / UEFA Europa League）
    cls: cup
    odds_sport_key: soccer_uefa_europa_league
    api_football_id: 3
    win007_id: 113             # 球探网「欧罗巴杯」sclassid

  # ---- 篮球（NBA，独立口径） ----
  - key: nba
    name: NBA 美国职业篮球联赛
    cls: league
    sport: basketball          # 篮球：让分/总分，结算不走 0.25/0.75 亚洲盘拆腿
    odds_sport_key: basketball_nba   # the-odds-api 的 NBA spreads/totals
    basketball_id: 3           # 球探网篮球联赛 id（NBA）

odds:
  # the-odds-api 拿这些博彩公司的赔率（取第一个可用的作为代表盘口）
  bookmakers:
    - pinnacle
    - bet365
    - unibet
  # spreads=亚盘(让球) totals=大小球
  markets:
    - spreads
    - totals

sync:
  # 只同步 N 天内开赛的场次，避免浪费免费额度
  upcoming_days: 7
  # 开赛前多少小时内尝试抓首发阵容
  lineup_window_hours: 6

analysis:
  # 历史样本：近 N 场（联赛/杯赛分开统计）
  form_matches: 5
  h2h_matches: 5
  # 临场窗口：最新水位快照落在开赛前 N 小时内算「临场」，仅作展示标签（不参与命中率统计）
  prematch_hours: 2
  # 出推荐窗口：只在开赛前 N 小时内出推荐（更早的场次不进看板/账本）。
  # 配合 6h/2h 两档：6h 内开始上架，2h 内算临场。
  publish_hours: 6
  weights:
    handicap:                  # 亚盘(让球)推荐权重
      water_move: 0.30         # 临场水位变动（降水/升水）
      line_move: 0.20          # 盘口升/降（让球数变化）
      form: 0.20               # 近期状态（同口径）
      h2h: 0.10                # 历史交手
      home_away: 0.10          # 主客场
      h2h_line: 0.10           # 历史交手盘口覆盖（结合过往比赛盘口）
    totals:                    # 大小球推荐权重
      water_move: 0.30         # 大/小水位变动
      line_move: 0.20          # 盘口升/降（2.5->3 等）
      attacking_form: 0.25     # 双方进攻效率
      defensive_form: 0.15     # 双方防守/失球
      h2h_total: 0.10          # 历史交手大小球覆盖（结合过往比赛盘口）
  thresholds:
    strong: 70                 # 分数 >= 70 -> 强推
    watch: 55                  # 分数 >= 55 -> 可关注，否则观望

# ------------------------------------------------------------
# 数据源选择
sources:
  odds: win007                 # the-odds-api | crown | win007
  fixtures: win007             # api-football | win007（win007 则赛程/结果也走球探网，免 key）
  crown_url: ""                # 皇冠盘 HTML 地址（或本地文件路径），odds=crown 时填写
  win007_url: "https://m.ewin007.com/Schedule.htm?date={date}"   # 球探网移动版赛程页（含亚盘盘口+大小球盘口）
  # 篮球（NBA）：让分/总分赔率走 the-odds-api（需 THE_ODDS_API_KEY）；赛程/结果走球探网篮球（免 key）
  basketball_odds: the-odds-api
  basketball_url: "https://bdata.7m.com.cn/basketball_match_data/3/big/match_list.js"

