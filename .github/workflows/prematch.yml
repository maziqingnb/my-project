name: Pre-match Alerts

on:
  schedule:
    # 每 30 分钟刷新临场水位，只推 2 小时内开赛的比赛（每场只推一次）
    # 配合同步层的线程池并行抓取，临场水位能及时反映到推荐，缓解「数据更新太慢」
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  prematch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync latest odds & analyze
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          python src/main.py sync --odds
          python src/main.py analyze

      - name: Notify pre-match
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python src/main.py notify --prematch-hours 2

      - name: Commit odds & notified state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/reports/
          git diff --cached --quiet && { echo "no changes to commit"; exit 0; }
          git commit -m "data: refresh pre-match odds [skip ci]"
          # 并发提交兜底：push 前先 rebase 到最新（冲突以本机新生成数据为准），退避重试
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase -X theirs origin/main && git push origin main; then
              echo "pushed after attempt $i"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $(( (RANDOM % 20) + 5 ))
          done
          echo "::error::push failed after 5 retries"; exit 1
