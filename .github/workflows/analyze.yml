name: Analyze Matches

on:
  schedule:
    # 每 6 小时跑一次（UTC）；临场水位变动主要靠多次快照对比
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# 多个工作流（analyze/live/prematch/review）都会向 main 提交 data/ docs/reports/，
# 并发提交会 push 冲突导致 commit 步骤失败。用同一 concurrency group 串行化，避免互相踩踏。
concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync & analyze
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: |
          python src/main.py sync --all
          python src/main.py analyze

      - name: Notify via WeChat
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python src/main.py notify

      - name: Commit data & report
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: refresh fixtures, odds & recommendations [skip ci]"
          file_pattern: "data/ docs/reports/"
          rebase_stale_commits: true
