name: Live Scores & Real-time Settle

on:
  schedule:
    # 每 5 分钟：同步进行中比分 + 今日赛果，赛果一出即结算命中并更新看板
    # GitHub 定时任务最细 5 分钟；私有仓库注意免费额度
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync live scores & settle
        run: python src/main.py live

      - name: Commit live scores & reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/reports/
          git diff --cached --quiet && { echo "no changes to commit"; exit 0; }
          git commit -m "data: refresh live scores & settle [skip ci]"
          # 并发提交兜底：push 前先 rebase 到最新（冲突以本机新生成数据为准），退避重试
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase -X theirs origin/main && git push origin main; then
              echo "pushed after attempt $i"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $(( (RANDOM % 20) + 5 ))
          done
          echo "::error::push failed after 5 retries"; exit 1
