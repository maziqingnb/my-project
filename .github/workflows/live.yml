name: Live Scores & Real-time Settle

on:
  schedule:
    # 每 5 分钟：同步进行中比分 + 今日赛果，赛果一出即结算命中并更新看板
    # GitHub 定时任务最细 5 分钟；私有仓库注意免费额度
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync live scores & settle
        run: python src/main.py live

      - name: Commit live scores & reports
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: refresh live scores & settle [skip ci]"
          file_pattern: "data/ docs/reports/"
          rebase_stale_commits: true
