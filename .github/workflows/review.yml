name: Daily Review (Missed Picks)

on:
  schedule:
    # 每天 15:30 UTC（= 北京时间 23:30）：当天比赛基本结束，复盘未命中并推送
    - cron: "30 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh results & settle
        run: python src/main.py live

      - name: Build & push daily review
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python src/main.py review --notify

      - name: Commit review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/reports/
          git diff --cached --quiet && { echo "no changes to commit"; exit 0; }
          git commit -m "data: daily review of missed picks [skip ci]"
          # 并发提交兜底：push 前先 rebase 到最新（冲突以本机新生成数据为准），退避重试
          for i in 1 2 3 4 5; do
            git fetch origin main
            if git rebase -X theirs origin/main && git push origin main; then
              echo "pushed after attempt $i"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $(( (RANDOM % 20) + 5 ))
          done
          echo "::error::push failed after 5 retries"; exit 1
