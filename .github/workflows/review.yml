name: Daily Review (Missed Picks)

on:
  schedule:
    # 每天 15:30 UTC（= 北京时间 23:30）：当天比赛基本结束，复盘未命中并推送
    - cron: "30 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh results & settle
        run: python src/main.py live

      - name: Build & push daily review
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: python src/main.py review --notify

      - name: Commit review
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: daily review of missed picks [skip ci]"
          file_pattern: "data/ docs/reports/"
