name: Bug Check (every 30 min)

on:
  schedule:
    # 每 30 分钟复查一次：跑演示冒烟测试 + 看板数据/前端自检，抓回归 bug
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bugcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test (demo data)
        run: python src/main.py analyze --demo

      - name: Data & frontend bug check
        run: python src/bugcheck.py
